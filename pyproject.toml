[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "augur"
version = "0.0.1"
description = "vLLM's real control plane on a virtual clock, with steps priced from GPU profiles."
requires-python = ">=3.11,<3.15"
dependencies = ["vllm==0.33.0"]

[project.optional-dependencies]
llmservingsim = ["pandas", "pyyaml", "rich", "scipy"]
test = ["pytest"]

[project.scripts]
augur = "augur.cli:main"

[tool.setuptools.packages.find]
include = ["augur*"]

[tool.setuptools.package-data]
augur = ["profiles/*/*/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
