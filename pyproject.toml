[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "augur"
version = "0.0.1"
description = "Run vLLM's real control plane on virtual time, with LLMServingSim pricing steps and transfers."
requires-python = ">=3.11,<3.15"
dependencies = ["vllm==0.33.0"]

[project.scripts]
augur = "augur.cli:main"

[tool.setuptools.packages.find]
include = ["augur*"]
